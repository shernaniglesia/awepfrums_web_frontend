<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" />
    <title>Modal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .custom-feedback-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(30, 60, 114, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 5000;
            animation: modalOverlayFade 0.3s ease-out;
        }

        @keyframes modalOverlayFade {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .feedback-box {
            width: 100%;
            max-width: 350px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .feedback-box i {
            font-size: 75px;
            margin-bottom: 10px;
        }

        .feedback-success {
            color: #2ecc71 !important;
        }

        .feedback-error {
            color: #e74c3c !important;
        }

        .feedback-warning {
            color: #f1c40f !important;
        }

        #feedbackTitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .feedback-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .feedback-btn:hover::before {
            left: 100%;
        }

        .feedback-btn:hover {
            transform: scale(-3px);
        }

        .confirm-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .confirm-message {
            font-size: 16px;
            margin-bottom: 18px;
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .confirm-btn {
            padding: .7rem .9rem;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn {
            background: #dcdcdc;
        }

        .cancel-btn:hover {
            background: #c6c6c6;
        }

        .yes-btn {
            background: #e74c3c;
            color: white;
        }

        .yes-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div id="feedbackModal" class="custom-feedback-modal">
        <div class="feedback-box">
            <i id="feedbackIcon" class="bi"></i>
            <h3 id="feedbackTitle"></h3>
            <p id="feedbackMessage"></p>
            <button id="feedbackClose" class="feedback-btn">OK</button>
        </div>
    </div>

    <div id="confirmModal" class="custom-feedback-modal">
        <div class="feedback-box">
            <i id="confirmIcon" class="bi"></i>
            <h3 id="confirmTitle" class="confirm-title"></h3>
            <p id="confirmMessage" class="confirm-message"></p>
            <div class="confirm-actions">
                <button id="cancelButton" class="confirm-btn cancel-btn">Cancel</button>
                <button id="yesButton" class="confirm-btn yes-btn ">Yes</button>
            </div>
        </div>
    </div>
</body>
</html>
