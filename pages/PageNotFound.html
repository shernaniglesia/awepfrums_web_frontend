<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
            background: white;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #ff5e5e;
            line-height: 1;
        }

        .error-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 15px 0;
            color: #2c3e50;
        }

        .error-message {
            font-size: 1rem;
            color: #7f8c8d;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            background-color: #1e3c72;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-home:hover {
            background-color: #2a5298;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">Oops! The page you are looking for has been moved, deleted, or never existed in the first place.</p>
        <button class="btn-home" onclick="window.history.back()">Go Back</button>
    </div>
</body>
</html>
