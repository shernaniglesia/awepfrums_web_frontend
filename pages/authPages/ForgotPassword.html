<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AWEPFRUMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <div id="loaderDisplay" class="loader-overlay">
        <div class="loader-container">
            <div class="loader"></div>
            <p class="loader-message">Loading...</p>
        </div>
    </div>

    <div class="container">
        <div class="logo-header">
            <h1 class="title">Forgot Password?</h1>
            <p class="subtitle">Enter your institutional email address to receive a password reset code.</p>
        </div>

        <form id="forgotForm">

            <div class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Enter Email Address</label>
                <div class="errorText" id="emailError"></div>
            </div>

            <div class="floating-group">
                <select id="role" class="floating-select" onclick="this.setAttribute('value', this.value);" onchange="this.setAttribute('value', this.value);" value="" required>
                    <option value="" hidden></option>
                    <option value="admin">Admin</option>
                    <option value="instructor">Instructor</option>
                    <option value="student">Student</option>
                </select>
                <label class="floating-label">Select Role</label>
                <div class="errorText" id="roleError"></div>
            </div>

            <button type="submit" id="forgotBtn">
                <span>
                    <span class="btn-text">Send Reset Code </span> 
                    <span class="btn-icon" id="btnIcon"><i class="fas fa-paper-plane"></i></span>
                </span>
            </button>
        </form>
        <button class="back-btn" id="backbtn">
            Back to Login
        </button>
    </div>

    <div id="feedbackContainer"></div>

    <script src="../../js/FeedbackModal.js"></script>
    <script type="module" src="../../js/authJs/ForgotPassword.js"></script>
</body>
</html>
