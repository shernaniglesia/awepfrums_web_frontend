<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AWEPFRUMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <div id="loaderDisplay" class="loader-overlay">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loaderMessage" class="loader-message">Loading...</p>
        </div>
    </div>

    <div class="container">
        <div class="logo-header">
            <h1 class="title">Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Email Address</label>
                <div class="errorText" id="emailError"></div>
            </div>

            <div class="floating-group">
                <select id="role" class="floating-select" onclick="this.setAttribute('value', this.value);" onchange="this.setAttribute('value', this.value);" value="" required>
                    <option value="" hidden></option>
                    <option value="admin">Admin</option>
                    <option value="instructor">Instructor</option>
                    <option value="student">Student</option>
                </select>
                <label class="floating-label">Role</label>
                <div class="errorText" id="roleError"></div>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <i class="fas fa-eye toggle-password" data-target="password"></i>
                <label for="password">Password</label>
                <div class="errorText" id="passwordError"></div>
            </div>

            <div class="forgot-password">
                <a href="ForgotPassword.html">
                    <i class="fas fa-key"></i>
                    Forgot Password?
                </a>
            </div>

            <button type="submit" id="loginBtn">
                <span>
                    <span class="btn-text">Sign In</span> <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
                </span>
            </button>

            <div class="link">
                Don't have an account? 
                <a href="Signup.html" id="signuplink">Create Account</a>
            </div>

            <div class="about-info" id="aboutInfo">
                <a href="../../index.html"><i class="fa fa-arrow-left" aria-hidden="true"></i> Back to Home</a>
            </div>
        </form>
    </div>

    <div id="feedbackContainer"></div>

    <script src="../../js/FeedbackModal.js"></script>
    <script type="module" src="../../js/authJs/Login.js"></script>
</body>
</html>
