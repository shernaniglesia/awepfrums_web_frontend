<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Detail | AWEPFRUMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/pages.css">
    <link rel="stylesheet" href="../../css/table.css">
    <style>
        .roomDetailContainer {
            background: none;
            height: calc(100vh - 70px);
        }

        .roomSemContainer {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mainHeader-title,
        #semesterInfo {
            color: #1e3c72;
            padding: .4rem;
            font-size: 1rem;
        }
        .weekNavigationContainer {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: .3rem .5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 20px;
            margin: 0 0 .5rem 0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #weekRange {
            color: var(--primary-blue);
        }

        .nav-button {
            padding: 0.45rem .7rem;
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }
    
        .timetableContainer {
            flex: 1;
            padding: 0 .5rem;
            overflow: hidden;
            height: 75vh;
        }

        .timetable {
            background: white;
            border-radius: 6px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            height: 100%;
        }

        .header-row {
            display: flex;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: .2rem;
        }

        .header-cell {
            flex: 1;
            text-align: center;
            padding: .2rem 0.1rem;
            font-size: 0.70rem;
            font-weight: 500;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .today {
            background: linear-gradient(135deg, #fef3c7, #fde68a) !important;
            color: #92400e !important;
            box-shadow: inset 0 0 0 2px rgba(255, 193, 7, 0.3);
            position: relative;
        }

        .day-column {
            flex: 1;
            position: relative;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        .event {
            position: absolute;
            left: 0;
            right: 0;
            margin: 0.1rem;
            border-radius: 8px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
            /* background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.95)); */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .event:hover {
            transform: translateY(-4px) scale(1.02);
            /* box-shadow: 0 12px 35px rgba(255, 107, 53, 0.3); */
            /* border-color: #ff6b35; */
            /* background: linear-gradient(135deg, rgba(255, 255, 255, 1), rgba(255, 243, 199, 0.9)); */
        }

        .time-gutter {
            width: 3.125rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .time-cell {
            font-size: .63rem;
            color: #6b7280;
            height: 2.45rem;
            text-align: right;
            padding-right: 6px;
        }

        .row {
            display: flex;
            min-height: 3.125rem;
        }

        #evTitle {
            font-size: .88rem;
            color: #333;
        }

        #evInstructor {
            font-size: .75rem;
            color: #333;
        }

        .room-detail-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .room-detail-modal-box {
            width: 330px;
            border-radius: 12px;
            padding: 10px 20px 20px 20px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(25px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transform: scale(0.8) translateY(20px);
            animation: modalSlideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.1s both;
            position: relative;
            overflow-y: auto;
        }

        @keyframes modalSlideUp {
            to {
                transform: scale(1) translateY(0);
            }
        }

        #roomDetailCloseModalButton {
            background-color: white;
            padding: 0;
            border: none;
            font-size: 1.7rem;
            font-weight: 500;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin: 0;
            cursor: pointer;
        }

        .room-detail-modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            text-align: center;
        }

        #roomDetailModalContent {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            color: #333;
        }

        .room-detail-modal-btn {
            flex: 1;
            padding: 8px 15px;
            font-size: 14px;
            margin: 5px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .room-detail-modal-btn.green {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .room-detail-modal-btn.green:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
        }

        .room-detail-modal-btn.gray {
            background: linear-gradient(135deg, #9ca3af, #6b7280);
            color: white;
            box-shadow: 0 4px 15px rgba(107, 114, 128, 0.3);
        }

        .room-detail-modal-btn.gray:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(107, 114, 128, 0.4);
        }

        @media (max-width: 768px) {
            .weekNavigationContainer {
                padding: .5rem .5rem;
            }

            .timetableContainer {
                padding: 0;
            }

            #evTitle {
                font-size: 8px;
                color: #000;
            }

            #evInstructor {
                font-size: 7px;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div id="loaderDisplay" class="loader-overlay">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loaderMessage" class="loader-message">Loading...</p>
        </div>
    </div>

    <aside id="sidebar">
        <nav>
            <div class="navHeader">
                <p class="navHeaderTitle">Student Panel</p>
                <button id="menuBtn" class="menuBtn">☰</button>
            </div>
            <a class="navLink" href="StudentDashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
            <a class="navLink" href="StudentViewRoom.html"><i class="fas fa-door-open"></i>Rooms</a>
            <a class="navLink" href="StudentViewEquipment.html"><i class="fas fa-boxes"></i>Equipments</a>
            <a class="navLink" href="StudentViewEquipmentReservation.html"><i class="fas fa-tools"></i>Equipment Reservation</a>
        </nav>
    </aside>

    <div id="overlay" class="overlay"></div>

    <main id="main">
        <div id="mainHeader">

            <div class="mainHeaderLeft">
                <button id="menuBtn2" class="menuBtn2">☰</button>
                <h3 class="mainHeaderLeftTitle">AWE-PFRUMS</h3>
            </div>

            <div class="searchContainer" style="display: none;">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                <input id="searchInput" type="search" placeholder="Search...">
            </div>

            <div class="mainHeaderRight">
                <!-- Notification Button -->
                <div class="notif-container" id="notif-bell">
                    <i class="fas fa-bell"></i> <span id="notif-count" class="badge"></span>
                </div>
                <div id="notif-dropdown" class="dropdown hidden">
                    <div class="dropdown-header">Notifications</div>
                    <button class="markAllAsRead" onclick="markAllAsRead()">Mark all as read</button>
                    <ul id="notif-list"></ul>
                    <button class="viewAllNotif" onclick="window.location.href = 'StudentNotification.html';">View All Notifications</button>
                </div>

                <!-- Profile Dropdown -->
                <div class="profile-container">
                    <div class="profile-avatar" id="profileAvatar">a</div>

                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-info">
                            <div class="mini-profile-avatar" id="miniProfileAvatar">A</div>
                            <div class="sub-profile-info">
                                <div class="profile-name" id="profileName">Shernan  C. Iglesia</div>
                                <div class="profile-role" id="profileRole">Admin</div>
                            </div>
                        </div>
                        <a href="StudentChangePassword.html" class="dropdown-item">
                            <i class="fas fa-key"></i>
                            Change Password
                        </a>
                        <button id="logoutBtn" 
                            onclick="openConfirmModal('logout','Logout Account','Are you sure you want to logout? Once you logout you need to login again. Are you okay?','Logout')">
                            <i class="fas fa-sign-out-alt"></i>
                            <span id="logoutBtnText">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="roomDetailContainer">
            <div class="roomSemContainer">
                <h4 id="mainHeader-title">Room Assignment</h4>
                <h4 id="semesterInfo"></h4>
            </div>
            
            <div class="weekNavigationContainer">
                <button id="prevBtn" class="nav-button">
                    <i class="bi bi-chevron-left"></i>
                    Previous
                </button>
                <p class="week-range" id="weekRange">Loading...</p>
                <button id="nextBtn" class="nav-button">
                    Next
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>

            <div class="timetableContainer">
                <div id="timetable" class="timetable"></div>
            </div>

            <div id="roomDetailModal" class="room-detail-modal-overlay">
                <div class="room-detail-modal-box">
                    <button id="roomDetailCloseModalButton" onclick="closeModal()"">x</button>
                    <div class="room-detail-modal-title" id="roomDetailModalTitle"></div>
                    <div id="roomDetailModalContent"></div>
                    <div style="display:flex; margin-top:20px;" id="roomDetailModalActions"></div>
                </div>
            </div>
        </div>

        <div id="feedbackContainer"></div>
        <div id="confirmContainer"></div>

    </main>

    <script src="../../js/Pages.js"></script>
    <script src="../../js/API.js"></script>
    <script src="../../js/FeedbackModal.js"></script>
    <script src="../../js/ConfirmModal.js"></script>
    <script src="../../js/SearchAndPagination.js"></script>
    <script src="../../js/studentJs/StudentViewRoomDetail.js"></script>
    <script>
        initUserProfile();
        fetchNotifications();
        displayNotifications();
        fetchTimetable();
    </script>
</body>
</html>
