<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Room | AWEPFRUMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/pages.css">
    <style>
        .secondColumn{
            width: 110px;
        }
        #dataTableBody {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .roomContainer {
            background: #fff;
            color: var(--primary-blue);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 4px solid transparent;
            position: relative;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            font-size: 1rem;
            border: 1px solid var(--primary-blue);
            background-color: #e8ecf7;
        }
        .roomContainer:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px;
            margin-top: 10px;
        }

        .pagination-controls {
            display: flex;
            gap: 5px;
        }

        .pagination-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .pagination-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .pagination-btn:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
            color: #ccc;
        }

        .pagination-info {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="loaderDisplay" class="loader-overlay">
        <div class="loader-container">
            <div class="loader"></div>
            <p id="loaderMessage" class="loader-message">Loading...</p>
        </div>
    </div>

    <aside id="sidebar">
        <nav>
            <div class="navHeader">
                <p class="navHeaderTitle">Student Panel</p>
                <button id="menuBtn" class="menuBtn">☰</button>
            </div>
            <a class="navLink" href="StudentDashboard.html"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
            <a class="navLink active" href="StudentViewRoom.html"><i class="fas fa-door-open"></i>Rooms</a>
            <a class="navLink" href="StudentViewEquipment.html"><i class="fas fa-boxes"></i>Equipments</a>
            <a class="navLink" href="StudentViewEquipmentReservation.html"><i class="fas fa-tools"></i>Equipment Reservation</a>
        </nav>
    </aside>

    <div id="overlay" class="overlay"></div>

    <main id="main">
        <div id="mainHeader">

            <div class="mainHeaderLeft">
                <button id="menuBtn2" class="menuBtn2">☰</button>
                <h3 class="mainHeaderLeftTitle">AWE-PFRUMS</h3>
            </div>

            <div class="searchContainer">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                <input id="searchInput" type="search" placeholder="Search...">
            </div>

            <div class="mainHeaderRight">
                <!-- Notification Button -->
                <div class="notif-container" id="notif-bell">
                    <i class="fas fa-bell"></i> <span id="notif-count" class="badge"></span>
                </div>
                <div id="notif-dropdown" class="dropdown hidden">
                    <div class="dropdown-header">Notifications</div>
                    <button class="markAllAsRead" onclick="markAllAsRead()">Mark all as read</button>
                    <ul id="notif-list"></ul>
                    <button class="viewAllNotif" onclick="window.location.href = 'StudentNotification.html';">View All Notifications</button>
                </div>

                <!-- Profile Dropdown -->
                <div class="profile-container">
                    <div class="profile-avatar" id="profileAvatar">a</div>

                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-info">
                            <div class="mini-profile-avatar" id="miniProfileAvatar">A</div>
                            <div class="sub-profile-info">
                                <div class="profile-name" id="profileName">Shernan  C. Iglesia</div>
                                <div class="profile-role" id="profileRole">Admin</div>
                            </div>
                        </div>
                        <a href="StudentChangePassword.html" class="dropdown-item">
                            <i class="fas fa-key"></i>
                            Change Password
                        </a>
                        <button id="logoutBtn" 
                            onclick="openConfirmModal('logout','Logout Account','Are you sure you want to logout? Once you logout you need to login again. Are you okay?','Logout')">
                            <i class="fas fa-sign-out-alt"></i>
                            <span id="logoutBtnText">Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mainContent">
            <div class="mainContentHeader">
                <p class="mainContentHeaderText">Rooms</p>
            </div>

            <div id="dataTableBody"></div>
            <!-- <table>
                <thead>
                    <tr>
                        <th class="firstColumn">Room</th>
                    </tr>
                </thead>

                <tbody id="dataTableBody"></tbody>
            </table> -->

            <div class="pagination-container">
                <div class="pagination-info">
                    Showing <span id="startIndex">0</span> to <span id="endIndex">0</span> of <span id="totalItems">0</span> rooms
                </div>
                <div class="pagination-controls" id="paginationControls">
                </div>
            </div>
        </div>

        <div id="feedbackContainer"></div>
        <div id="confirmContainer"></div>

    </main>

    <script src="../../js/Pages.js"></script>
    <script src="../../js/API.js"></script>
    <script src="../../js/FeedbackModal.js"></script>
    <script src="../../js/ConfirmModal.js"></script>
    <script src="../../js/SearchAndPagination.js"></script>
    <script src="../../js/studentJs/StudentViewRoom.js"></script>
    <script>
        initUserProfile();
        fetchNotifications();
        displayNotifications();
        fetchRooms();
    </script>
</body>
</html>
